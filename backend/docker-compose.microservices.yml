version: '3.8'

services:
  # --- INFRASTRUCTURE ---
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-echoes_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # --- SERVICES ---
  
  # API Gateway (Входная точка)
  gateway:
    build: ./apps/gateway
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - MONOLITH_URL=http://legacy-backend:5000
    depends_on:
      - auth-service
      - legacy-backend

  # Auth Service (Новый сервис авторизации)
  auth-service:
    build: ./apps/auth
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-echoes_db}?schema=public
    depends_on:
      - postgres

  # Legacy Monolith (Старый бэкенд)
  legacy-backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-echoes_db}?schema=public
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
